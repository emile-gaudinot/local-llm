<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local LLM</title>
    <link rel="icon" href="./favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="node_modules/highlight.js/styles/night-owl.min.css">
</head>

<body>
    <button id="trashBtn">As
        <img id="trash" src="assets/trash.png" alt="Trash icon" />
    </button>
    <div class="container">
        <div id="history"></div>
        <div class="input-group">
            <textarea id="prompt-input" placeholder="Ask a question..." rows="1"></textarea>
        </div>
        <div id="button-group">
            <button id="selectFileBtn">As
                <img id="paperclip" src="assets/paperclip.png" alt="File upload icon" />
            </button>
            <input type="file" id="fileInput" accept=".jpg, .jpeg, .png, .pdf, .docx, .pptx" style="display: none;">
            <select id="model-selector">
                <!-- Options are populated dynamically -->
            </select>
            <button id="run-button">Ask
                <div id="loader" class="hidden">
                    <div class="inner one"></div>
                    <div class="inner two"></div>
                    <div class="inner three"></div>
                </div>
            </button>
        </div>
    </div>
    <script src="node_modules/marked/marked.min.js"></script>
    <script src="node_modules/highlight.js/highlight.min.js"></script>
    <script type="module" src="script.js"></script>
</body>
</html>
